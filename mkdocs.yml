site_name: tatva
site_description: The documentation for the tatva software package

repo_url: https://github.com/smec-ethz/tatva
repo_name: smec-ethz/tatva

copyright: Copyright &copy; 2026 ETH Zurich (SMEC)

theme:
  name: material
  features:
    - header-autohide # header disappears when scrolling down
    - announce.dismiss
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - navigation.instant.preview
    - navigation.tabs
    - navigation.top
    - navigation.tabs.sticky
    - search.highlight
    - search.suggest
    - content.footnote.tooltips

  palette:
    - scheme: default
      primary: white
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  favicon: "assets/favicon.png"
  logo: "assets/favicon.png"
  icon:
    repo: fontawesome/brands/github # GitHub logo in top right
    tag:
      default: lucide/hash
  font:
    text: Inter # Clean, modern, very readable
    code: JetBrains Mono # The gold standard for code readability

extra_javascript:
  # The below two make MathJax work, see https://squidfunk.github.io/mkdocs-material/reference/mathjax/
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/vtk.js
  - https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js
  - javascripts/carousel.js

extra_css:
  - https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200
  - stylesheets/custom_css.css
  - stylesheets/mkdocstrings.css
  - https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css
  - stylesheets/carousel.css
  - stylesheets/extra.css

markdown_extensions:
  - attr_list
  - admonition
  - footnotes
  - md_in_html
  - pymdownx.arithmatex: # Render LaTeX via MathJax
      generic: true
  - pymdownx.emoji:
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.magiclink
  - pymdownx.superfences # Seems to enable syntax highlighting when used with the Material theme.
  - pymdownx.details # Allowing hidden expandable regions denoted by ???
  - pymdownx.snippets: # Include one Markdown file into another
      base_path: docs
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - toc:
      permalink: "¤" # Adds a clickable permalink to each section heading
      toc_depth: 4

plugins:
  - search:
  - autorefs
  - section-index
  - tags
  - mkdocstrings:
      handlers:
        python:
          paths: [tatva]
          options:
            backlinks: tree
            docstring_options:
              ignore_init_summary: true
            docstring_section_style: list
            filters: ["!^_"]
            force_inspection: true
            heading_level: 3
            inherited_members: true
            merge_init_into_class: true
            parameter_headings: true
            separate_signature: true
            members_order: source
            show_bases: false
            show_if_no_docstring: true
            show_overloads: false
            show_root_heading: true
            show_signature_annotations: true
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            summary: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/smec-ethz/tatva
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/tatva/

  tags:
    default: default

nav:
  - Home: "index.md"
  - Getting Started: "getting_started.md"
  - Basics of tatva:
      - Creating Energy Functional: "operator.md"
      - Building Stiffness Matrix: "sparse.md"
      - Handling Multifield DoFs: "compound.md"
      - Applying Constraints or BCs: "lifter.md"
      - Building Custom Elements: "custom_elements.md"
  - Examples:
      - Elasticity:
          - "examples/linear_elasticity.md"
      - Hyperelasticity:
          - "examples/hyperelastic_3d.md"
      - Transient Problems:
          - "examples/elastodynamics_3d.md"
          - "examples/heat_exchange.md"
      - Multi-point Constraints:
          - "examples/nonlinear_hole_plate.md"
      - Contact Mechanics:
          - "examples/contact_3d.md"
      - Lagrange Multipliers:
          - Adhesion: "examples/adhesion_lagrange_multipliers.md"
          - "examples/homogenization_periodic.md"
      - Fracture:
          - Cohesive Fracture:
              - Using Nitsche's Method: "examples/fracture_nitsche_quasistatic_3d.md"
              - Using Penalty method: "examples/fracture_quasistatic_3d.md"
      - Mixed-Dimensional Coupling:
          - "examples/soft_hydrogel.md"
      - Multiphysics Coupling:
          - "examples/thermal_shock_fracture.md"
      - Non-Variational Formulations:
          - "examples/advection_diffusion_surface.md"
      - Data-Driven Modeling:
          - "examples/ncm_metamaterial.md"
          - "examples/neural_operator_method_3d.md"
      - Beams:
          - "examples/euler_bernoulli_2d_beam.md"
          - "examples/timoshenko_2d_beam.md"
  - Using External Solvers:
      - SciPy:
          - "external_solvers/linear_elasticity_scipy.md"
      - PETSc:
          - "external_solvers/linear_elasticity_petsc4py.md"
          - "external_solvers/linear_elasticity_petsc4py_mf.md"
  - API reference:
      - Operator: "api/tatva.operator.md"
      - Mesh: "api/tatva.mesh.md"
      - Element: "api/tatva.element.md"
      - Sparse: "api/tatva.sparse.md"
      - Compound: "api/tatva.compound.md"
      - Lifter: "api/tatva.lifter.md"
